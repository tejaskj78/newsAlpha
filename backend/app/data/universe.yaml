# The stock universe and the macro themes the engine understands.
#
# Alias matching rule: an alias written in lowercase is matched case-insensitively;
# an alias containing any uppercase letter is matched case-sensitively
# (so "Apple" matches the company but not "apple pie").

tickers:
  # ---------------- India (NSE) ----------------
  RELIANCE.NS:
    name: Reliance Industries
    market: IN
    sector: energy
    aliases: [reliance industries, "RIL", jio platforms, reliance jio, mukesh ambani, "Reliance"]
  ONGC.NS:
    name: Oil and Natural Gas Corp
    market: IN
    sector: energy
    aliases: [ongc, oil and natural gas corporation]
  TCS.NS:
    name: Tata Consultancy Services
    market: IN
    sector: it
    aliases: ["TCS", tata consultancy]
  INFY.NS:
    name: Infosys
    market: IN
    sector: it
    aliases: [infosys, salil parekh]
  HDFCBANK.NS:
    name: HDFC Bank
    market: IN
    sector: banking
    aliases: [hdfc bank]
  ICICIBANK.NS:
    name: ICICI Bank
    market: IN
    sector: banking
    aliases: [icici bank]
  SBIN.NS:
    name: State Bank of India
    market: IN
    sector: banking
    aliases: [state bank of india, "SBI"]
  MARUTI.NS:
    name: Maruti Suzuki
    market: IN
    sector: auto
    aliases: [maruti suzuki, maruti]
  SUNPHARMA.NS:
    name: Sun Pharmaceutical
    market: IN
    sector: pharma
    aliases: [sun pharma, sun pharmaceutical]
  INDIGO.NS:
    name: InterGlobe Aviation (IndiGo)
    market: IN
    sector: aviation
    aliases: ["IndiGo", interglobe aviation]
  BEL.NS:
    name: Bharat Electronics
